databaseChangeLog:
  - changeSet:
      id: 014-create-processed-message-table
      author: elizaveta
      changes:
        - createTable:
            tableName: processed_message
            columns:
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: trace_id
                  type: varchar(255)
              - column:
                  name: processed_at
                  type: timestamp
                  constraints:
                    nullable: false

        - createIndex:
            tableName: processed_message
            indexName: idx_processed_message_order_id
            columns:
              - column:
                  name: order_id

        - createIndex:
            tableName: processed_message
            indexName: idx_processed_message_trace_id
            columns:
              - column:
                  name: trace_id
