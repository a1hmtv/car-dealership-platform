databaseChangeLog:
  - changeSet:
      id: 008-create-in-stock-order-table
      author: elizaveta
      changes:
        - createTable:
            tableName: in_stock_order
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: removed
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: manager_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: car_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: in_stock_order
            baseColumnNames: customer_id
            referencedTableName: customer
            referencedColumnNames: id
            constraintName: fk_in_stock_order_customer

        - addForeignKeyConstraint:
            baseTableName: in_stock_order
            baseColumnNames: manager_id
            referencedTableName: manager
            referencedColumnNames: id
            constraintName: fk_in_stock_order_manager

