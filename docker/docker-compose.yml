x-app-env: &app-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-dealer}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dealer-local}
  JWT_ISSUER_URI: http://localhost:8081/realms/dealer-realm
  JWT_JWK_SET_URI: http://keycloak:8080/realms/dealer-realm/protocol/openid-connect/certs

services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-db:
    image: postgres:16
    environment:
      POSTGRES_DB: storage_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - storage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/dealer-realm.json:/opt/keycloak/data/import/dealer-realm.json:ro

  rabbitmq:
    image: rabbitmq:3-management
    hostname: dealer-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dealer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dealer-local}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  storage-service:
    build:
      context: ..
      dockerfile: storage-service/Dockerfile
    depends_on:
      storage-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:9090:9090"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://storage-db:5432/storage_db
      GRPC_SERVER_PORT: "9090"

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    depends_on:
      order-db:
        condition: service_healthy
      storage-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      GRPC_CLIENT_STORAGE_SERVICE_ADDRESS: static://storage-service:9090
      GRPC_CLIENT_STORAGE_SERVICE_NEGOTIATION_TYPE: plaintext

volumes:
  order_postgres_data:
  storage_postgres_data:
  rabbitmq_data:
