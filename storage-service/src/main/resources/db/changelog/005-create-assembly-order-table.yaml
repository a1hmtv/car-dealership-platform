databaseChangeLog:
  - changeSet:
      id: 013-create-assembly-order-table
      author: elizaveta
      changes:
        - createTable:
            tableName: assembly_order
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: source_order_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: car_id
                  type: uuid
              - column:
                  name: model_id
                  type: uuid
              - column:
                  name: warehouse_employee_id
                  type: uuid
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: removed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 014-create-assembly-order-required-part-table
      author: elizaveta
      changes:
        - createTable:
            tableName: assembly_order_required_part
            columns:
              - column:
                  name: assembly_order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: part_id
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: assembly_order_required_part
            baseColumnNames: assembly_order_id
            referencedTableName: assembly_order
            referencedColumnNames: id
            constraintName: fk_assembly_order_required_part_order
